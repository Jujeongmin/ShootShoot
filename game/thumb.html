<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>무기 썸네일 추출</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #1a1a2e;
        color: #dadce7;
        font-family: 'Malgun Gothic', sans-serif;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { font-size: 13px; color: #989aaf; margin: 0 0 16px; }
      #stage {
        /* 체커보드로 투명 영역을 눈으로 확인한다 */
        background-image:
          linear-gradient(45deg, #2a2a3e 25%, transparent 25%),
          linear-gradient(-45deg, #2a2a3e 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #2a2a3e 75%),
          linear-gradient(-45deg, transparent 75%, #2a2a3e 75%);
        background-size: 24px 24px;
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        width: 512px;
        height: 512px;
      }
      .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
      button, select {
        font: inherit;
        padding: 8px 16px;
        background: #ffcc00;
        color: #1a1a2e;
        border: none;
        cursor: pointer;
        font-weight: bold;
      }
      select { background: #dadce7; }
      label { font-size: 13px; }
      input[type=range] { vertical-align: middle; }
      #status { font-size: 13px; margin-top: 12px; min-height: 1.2em; }
      .err { color: #e4503a; }
    </style>
  </head>
  <body>
    <h1>무기 썸네일 추출</h1>
    <p>
      기존 <code>images/weapons/*.png</code>와 같은 규격(512×512, 투명 배경)으로 저장한다.
      각도와 크기를 맞춘 뒤 <b>PNG 저장</b>을 누르고, 받은 파일을
      <code>game/public/images/weapons/</code> 에 넣어라.
    </p>

    <canvas id="stage" width="512" height="512"></canvas>

    <div class="row">
      <select id="model"></select>
      <button id="save">PNG 저장</button>
      <button id="reset">각도 초기화</button>
    </div>
    <div class="row">
      <label>회전 Y <input id="ry" type="range" min="-180" max="180" step="1" value="35" /></label>
      <label>회전 X <input id="rx" type="range" min="-90" max="90" step="1" value="15" /></label>
      <label>여백 <input id="pad" type="range" min="0" max="40" step="1" value="12" /></label>
    </div>
    <div id="status"></div>

    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
      import { CONFIG } from './src/config.ts';

      const canvas = document.getElementById('stage');
      const statusEl = document.getElementById('status');
      const modelSelect = document.getElementById('model');
      const ry = document.getElementById('ry');
      const rx = document.getElementById('rx');
      const pad = document.getElementById('pad');

      // config에 있는 무기 전부를 대상으로 둔다. 바주카포는 weapons 배열이 아니라
      // CONFIG.bazooka.weapon 에 따로 들어 있어서 앞에 붙여 준다.
      const entries = [CONFIG.bazooka.weapon, ...CONFIG.weapons];
      for (const weapon of entries) {
        const option = document.createElement('option');
        option.value = weapon.id;
        option.textContent = `${weapon.name} (${weapon.id})`;
        modelSelect.appendChild(option);
      }

      // alpha:true + setClearAlpha(0) 이라야 배경이 투명하게 저장된다.
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(512, 512, false);
      renderer.setClearAlpha(0);

      const scene = new THREE.Scene();
      scene.add(new THREE.AmbientLight(0xffffff, 1.6));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(3, 5, 4);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.8);
      fill.position.set(-4, 1, -3);
      scene.add(fill);

      const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
      const pivot = new THREE.Group();
      scene.add(pivot);

      let current = null;

      function loadModel(weapon) {
        if (weapon.format === 'fbx') return new FBXLoader().loadAsync(weapon.model);
        return new GLTFLoader().loadAsync(weapon.model).then((gltf) => gltf.scene);
      }

      // 모델마다 원점과 크기가 제각각이라, 바운딩 박스를 재서 원점에 맞추고
      // 카메라를 반경에 맞춰 물린다. config의 scale/position은 1인칭 뷰모델용이라 안 쓴다.
      function frame(object) {
        const box = new THREE.Box3().setFromObject(object);
        const size = box.getSize(new THREE.Vector3());
        const centre = box.getCenter(new THREE.Vector3());
        object.position.sub(centre);

        const radius = Math.max(size.x, size.y, size.z) * 0.5;
        const margin = 1 + Number(pad.value) / 100;
        const fov = THREE.MathUtils.degToRad(camera.fov);
        const distance = (radius * margin) / Math.sin(fov / 2);
        camera.position.set(0, 0, distance);
        camera.lookAt(0, 0, 0);
        camera.near = Math.max(distance - radius * 4, 0.01);
        camera.far = distance + radius * 4;
        camera.updateProjectionMatrix();
      }

      function render() {
        if (!current) return;
        pivot.rotation.y = THREE.MathUtils.degToRad(Number(ry.value));
        pivot.rotation.x = THREE.MathUtils.degToRad(Number(rx.value));
        frame(current);
        renderer.render(scene, camera);
      }

      function select(id) {
        const weapon = entries.find((entry) => entry.id === id);
        statusEl.className = '';
        statusEl.textContent = `${weapon.model} 로드 중...`;
        loadModel(weapon)
          .then((model) => {
            if (current) pivot.remove(current);
            current = model;
            pivot.add(model);
            render();
            statusEl.textContent = `${weapon.name} 준비됨.`;
          })
          .catch((error) => {
            statusEl.className = 'err';
            statusEl.textContent = `로드 실패: ${weapon.model} — ${error.message}`;
          });
      }

      function save() {
        const weapon = entries.find((entry) => entry.id === modelSelect.value);
        render();
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `${weapon.id}.png`;
          link.click();
          URL.revokeObjectURL(url);
          statusEl.className = '';
          statusEl.textContent = `${weapon.id}.png 저장됨. game/public/images/weapons/ 에 넣어라.`;
        }, 'image/png');
      }

      for (const control of [ry, rx, pad]) control.addEventListener('input', render);
      modelSelect.addEventListener('change', () => select(modelSelect.value));
      document.getElementById('save').addEventListener('click', save);
      document.getElementById('reset').addEventListener('click', () => {
        ry.value = '35';
        rx.value = '15';
        pad.value = '12';
        render();
      });

      select(entries[0].id);
    </script>
  </body>
</html>
